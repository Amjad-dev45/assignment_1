[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epita-entropy-tree"
version = "0.1.0"
description = "A pure Python decision tree classifier using entropy and information gain"
readme = "TREE_README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
entropy-tree = "entropy_tree.__main__:main"

[tool.setuptools.packages.find]
include = ["entropy_tree*"]
